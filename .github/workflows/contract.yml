name: Production contract

# Proves the client works against the real deployment. Kept out of CI on
# purpose: a production blip should not turn an unrelated pull request red.
#
# Requires the LITICA_TEST_API_KEY secret — a key for the dedicated SDK test
# tenant, deliberately separate from the deploy smoke gate's tenant so this
# suite's churn never touches the thing that gates releases.
#
# pull_request is NOT a trigger: GitHub withholds secrets from fork PRs, so the
# suite would skip there anyway, and running it on trusted PRs would let a
# branch write to a live tenant before review.

on:
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC daily
  workflow_dispatch:      # manual, e.g. immediately before tagging a release

jobs:
  contract:
    runs-on: ubuntu-latest
    environment: production-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The suite skips itself without a key, which is right for local runs and
      # fork PRs — but here a missing key means this job is misconfigured, and
      # 12 silent skips would report green. Fail loudly instead.
      - name: Require the test key
        env:
          LITICA_TEST_API_KEY: ${{ secrets.LITICA_TEST_API_KEY }}
        run: |
          if [ -z "$LITICA_TEST_API_KEY" ]; then
            echo "::error::LITICA_TEST_API_KEY is not set. This job exists to \
          exercise a live deployment; skipping every test and reporting success \
          would be a false green."
            exit 1
          fi

      - name: Contract tests against the live deployment
        env:
          LITICA_TEST_API_KEY: ${{ secrets.LITICA_TEST_API_KEY }}
          LITICA_TEST_BASE_URL: ${{ vars.LITICA_TEST_BASE_URL || 'https://mcp.litica.org' }}
        # -p no:cacheprovider keeps the runner clean; --strict-config catches a
        # malformed pytest section rather than silently ignoring it.
        run: pytest tests/test_production_contract.py -v --strict-config

      # Belt and braces: even with a key present, a collection error or an
      # accidental skip marker could still produce zero executed tests.
      - name: Assert the tests actually ran
        if: always()
        env:
          LITICA_TEST_API_KEY: ${{ secrets.LITICA_TEST_API_KEY }}
          LITICA_TEST_BASE_URL: ${{ vars.LITICA_TEST_BASE_URL || 'https://mcp.litica.org' }}
        run: |
          pytest tests/test_production_contract.py --collect-only -q 2>/dev/null \
            | tail -1
          COUNT=$(pytest tests/test_production_contract.py --collect-only -q \
            2>/dev/null | grep -cE '^tests/' || true)
          if [ "$COUNT" -lt 10 ]; then
            echo "::error::Only $COUNT contract tests collected; expected 12."
            exit 1
          fi
          echo "Collected $COUNT contract tests."
