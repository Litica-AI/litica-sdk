name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Unit + packaging only. No secrets, no network — so this runs identically
    # for fork PRs. The suite that talks to a live deployment is contract.yml.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check litica tests

      - name: Format check
        run: ruff format --check litica tests

      - name: Unit + packaging tests
        run: pytest -q

  install-from-clean:
    # Proves the built wheel installs and imports with only its declared
    # dependency present — the failure mode a dev-environment test cannot see.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel in a clean environment and import it
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          /tmp/clean/bin/python -c "
          import litica
          c = litica.Client(api_key='lk_fake', base_url='https://example.invalid')
          assert callable(c.search_memories)
          assert not hasattr(litica.Client, 'provision')
          print('import ok:', litica.__version__)
          "

      - name: Assert no engine source shipped
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          leaked = [n for n in names
                    if n.startswith(("litica_core", "litica_server", "migrations"))]
          if leaked:
              sys.exit(f"closed-source files in the wheel: {leaked}")
          print("wheel contents clean:", sorted(n for n in names if n.endswith(".py")))
          PY
