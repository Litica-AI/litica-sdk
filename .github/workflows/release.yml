name: Release

# Tag-triggered publish via PyPI Trusted Publishing (OIDC) — no long-lived PyPI
# token is stored in this repository. Configure the publisher once at
# https://pypi.org/manage/project/litica/settings/publishing/ with:
#   owner: Litica-AI   repo: litica-sdk   workflow: release.yml
#   environment: pypi

#
# workflow_dispatch runs everything except the final upload — a dry run that
# exercises the build, the safety checks, and the artifact hand-off between
# jobs. Without it the only way to discover a broken release pipeline is to
# tag a release, which is the worst possible moment to find out.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the tag matches the packaged version
        if: github.event_name == 'push'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match pyproject version $PKG" >&2
            exit 1
          fi

      - name: Assert no engine source shipped
        run: |
          python - <<'PY'
          import zipfile, glob, sys
          wheel = glob.glob("dist/*.whl")[0]
          leaked = [n for n in zipfile.ZipFile(wheel).namelist()
                    if n.startswith(("litica_core", "litica_server", "migrations"))]
          if leaked:
              sys.exit(f"REFUSING TO PUBLISH — closed-source files in wheel: {leaked}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Dry run — everything but the upload
        if: github.event_name != 'push'
        run: |
          echo "Artifacts built and handed between jobs successfully:"
          ls -l dist/
          test -n "$(ls dist/*.whl 2>/dev/null)" || { echo "::error::no wheel"; exit 1; }
          test -n "$(ls dist/*.tar.gz 2>/dev/null)" || { echo "::error::no sdist"; exit 1; }
          echo "Dry run complete. Nothing was published."

      - uses: pypa/gh-action-pypi-publish@release/v1
        if: github.event_name == 'push'
